	<style>
		:root {
			--primary: #3D1F79;
		}

		*, *::before, *::after {
			font-family: inherit;
			box-sizing: border-box;
		}

		* {
			color: white;
		}

		html {
			background: var(--primary);
		}

		body {
			min-height: 100vh;
			font-family: 'Montserrat', sans-serif;
			text-align: center;
			margin: 0;
			padding: 7vh 5vw 2vh;
			position: relative;
			display: grid;
			align-content: center;
		}

		body::after {
			content: "";
			background: url(temp-background.webp) 70% top no-repeat;
			background-size: cover;
			position: fixed;
			top: 0;
			left: 0;
			height: 100%;
			width: 100%;
			z-index: -1;
			filter: grayscale(1);
			mix-blend-mode: luminosity;
			opacity: .1;
		}

		@media (max-width: 1000px) {
			body::after {
				background: url(temp-background-mobile.webp) 70% top no-repeat;
				background-size: cover;
			}
		}

		h1 {
			margin: 0;
			font-family: 'Playfair Display', serif;
			font-size: clamp(55px, 10vw, 160px);
			line-height: 1.1;
		}

		h1 .subhead {
			margin-top: .25em;
			display: block;
			font-size: clamp(16px, 2vw, 72px);
			font-family: 'Montserrat', sans-serif;
		}

		.button {
			border: 1px solid white;
			background: var(--primary);
			color: white;
			padding: .35em 1.25em;
			font-size: clamp(1.5rem, 2vw, 3rem);
			font-weight: bold;
			text-decoration: none;
			cursor: pointer;
			user-select: none;
			margin: 0 auto;
			display: block;
			width: max-content;
			transition: all .3s;
		}

		.button:hover {
			border: 1px solid var(--primary);
			background: white;
			color: var(--primary);
		}

		.coming-soon {
			margin: 3rem 0;
		}

		.coming-soon h2 {
			opacity: .6;
		}

		.headshot {
			width: 250px;
			height: auto;
			margin: 2rem 0;
		}

		footer small {
			font-style: italic;
			text-align: center;
			font-size: .7rem;
		}


		/*One-Offs*/
		@keyframes shake {
			10%, 90% {transform: rotate(-.5deg);}
			20%, 80% {transform: rotate(1deg);}
			30%, 50%, 70% {transform: rotate(-2deg);}
			40%, 60% {transform: rotate(2deg);}
		}
		.survey {
			display: block;
			width:max-content;
			text-decoration: none;
			background:white;
			color:var(--primary);
			text-align: center;
			padding:2em 2em 1.6em;
			border-radius:5em;
			margin:0 auto 3em;
			position: relative;
		}
		.survey:hover {
			animation: shake 0.82s cubic-bezier(.36,.07,.19,.97) both;
			transform: translate3d(0, 0, 0);
			backface-visibility: hidden;
			perspective: 1000px;
		}
		.survey em {
			color:var(--primary);
			font-weight: 900;
		}
		.survey span {
			display: block;
			color:var(--primary);
			font-weight: 900;
			margin-top: .15em;
			font-size: 1.5rem;
			text-decoration: underline;
		}
		.survey:after {
			content: '';
			top: 93%;
			left: 80%;
			transform:rotate(30deg);
			position: absolute;
			border: 0 solid;
			display: block;
			width: 30px;
			height: 16px;
			background-color: transparent;
			border-bottom-left-radius: 30%;
			border-bottom-right-radius: 150%;
			box-shadow: -21px 9px 0 8px white;
		}
	</style>
